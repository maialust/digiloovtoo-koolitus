<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1e45" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lehte ei leitud | Digiloovtöö juhendajate koolitus</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #f4f6fb;
        background: radial-gradient(60rem 40rem at 10% 0%, #1d3a7a 0%, transparent 60%),
          radial-gradient(40rem 30rem at 100% 100%, #3b2a8f 0%, transparent 60%), #0b1e45;
      }
      main { max-width: 34rem; text-align: center; }
      .code { font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; letter-spacing: -0.05em; line-height: 1;
        background: linear-gradient(90deg, #ff8a73, #ffc23d, #3fd6c6); -webkit-background-clip: text; background-clip: text; color: transparent; }
      h1 { font-size: 1.75rem; margin: 1rem 0 0.75rem; }
      p { color: #c9d2e6; line-height: 1.6; margin: 0 0 2rem; }
      a { display: inline-block; padding: 0.9rem 1.5rem; border-radius: 999px; background: #ff8a73; color: #0b1e45;
        font-weight: 700; text-decoration: none; }
      a:hover { background: #ffa28f; }
      a:focus-visible { outline: 3px solid #ffc23d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>Seda lehte ei leitud</h1>
      <p>Aadress võib olla muutunud või sisestatud valesti. Digiloovtöö juhendajate koolituse info leiad avalehelt.</p>
      <a href="%BASE_URL%">Mine avalehele</a>
    </main>
  </body>
</html>
